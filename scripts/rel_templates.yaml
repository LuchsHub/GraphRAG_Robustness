templates:
  - id: 0
    name: "Find products often bought with a given product"
    hops: 1
    find_assignments_cypher: |
      MATCH (p:product)-[:also_buy]->(target:product)
      WITH p, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN p.id AS p_id
    instantiate_assignment_cypher: |
      MATCH path = (p:product {id: $p_id})-[:also_buy]->(target:product)
      UNWIND relationships(path) AS r
      RETURN p.name AS p_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: ('{p_name}':product)-[:also_buy]-(target:product)
  - id: 1
    name: "Find products from a given brand"
    hops: 1
    find_assignments_cypher: |
      MATCH (target:product)-[:has_brand]->(b:brand)
      WITH b, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN b.id AS b_id
    instantiate_assignment_cypher: |
      MATCH path = (target:product)-[:has_brand]->(b:brand {id: $b_id})
      UNWIND relationships(path) AS r
      RETURN b.name AS b_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: (target:product)-[:has_brand]-('{b_name}':brand)
  - id: 2
    name: "Find colored products that are often bought with a given product"
    hops: 2
    find_assignments_cypher: |
      MATCH (p:product)<-[:also_buy]-(target:product)-[:has_color]->(c:color)
      WITH p, c, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN p.id AS p_id, c.id AS c_id
    instantiate_assignment_cypher: |
      MATCH path = (p:product {id: $p_id})<-[:also_buy]-(target:product)-[:has_color]->(c:color {id: $c_id})
      UNWIND relationships(path) AS r
      RETURN p.name AS p_name, c.name AS c_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: ('{p_name}':product)-[:also_buy]-(target:product)-[:has_color]-('{c_name}':color)
  - id: 3
    name: "Find product given brand and category"
    hops: 2
    find_assignments_cypher: |
      MATCH (b:brand)<-[:has_brand]-(target:product)-[:has_category]->(c:category)
      WITH b, c, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN b.id AS b_id, c.id AS c_id
    instantiate_assignment_cypher: |
      MATCH path = (b:brand {id: $b_id})<-[:has_brand]-(target:product)-[:has_category]->(c:category {id: $c_id})
      UNWIND relationships(path) AS r
      RETURN b.name AS b_name, c.name AS c_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: ('{b_name}':brand)-[:has_brand]-(target:product)-[:has_category]-('{c_name}':category)
  - id: 4
    name: "Find colored products often bought with products of a given category"
    hops: 3
    find_assignments_cypher: |
      MATCH (ca:category)<-[:has_category]-(:product)-[:also_buy]->(target:product)-[:has_color]->(co:color)
      WITH ca, co, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN ca.id AS ca_id, co.id AS co_id
    instantiate_assignment_cypher: |
      MATCH path = (ca:category {id: $ca_id})<-[:has_category]-(:product)-[:also_buy]->(target:product)-[:has_color]->(co:color {id: $co_id})
      UNWIND relationships(path) AS r
      RETURN ca.name AS ca_name, co.name AS co_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: ('{ca_name}':category)-[:has_category]-(:product)-[:also_buy]-(target:product)-[:has_color]-('{co_name}':color)
  - id: 5
    name: "Find products often viewed with products of a given brand and category"
    hops: 3
    find_assignments_cypher: |
      MATCH (c:category)<-[:has_category]-(p:product)-[:has_brand]->(b:brand),
            (p:product)-[:also_view]->(target:product)
      WITH b, c, count(DISTINCT target) AS answer_count
      WHERE answer_count <= 10
      RETURN b.id AS b_id, c.id AS c_id
    instantiate_assignment_cypher: |
      MATCH path1 = (c:category {id: $c_id})<-[:has_category]-(p:product)-[:has_brand]->(b:brand {id: $b_id}),
            path2 = (p:product)-[:also_view]->(target:product)
      UNWIND (relationships(path1) + relationships(path2)) AS r
      RETURN b.name AS b_name, c.name AS c_name,
        count(DISTINCT target) AS answer_count,
        collect(DISTINCT toInteger(target.id)) AS answer_ids,
        collect(DISTINCT [toInteger(startNode(r).id), type(r), toInteger(endNode(r).id)]) AS triples
    llm_input: (p:product)-[:also_view]-(target:product) & ('{c_name}':category)-[:has_category]-(p:product)-[:has_brand]-('{b_name}':brand)
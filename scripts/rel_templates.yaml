templates:
  - id: 0
    name: "Find products often bought with a given product"
    hops: 1
    sampling_cypher: |
      MATCH path = (p:product)-[:also_buy]-(target:product)
      WITH p, 
          count(DISTINCT target) AS answer_count, 
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN p.name AS pname, answer_count, answer_ids, paths
      ORDER BY rand()
      LIMIT 5
    log_format: (p:product)-[:also_buy]-(target:product)
    llm_input: ('{pname}':product)-[:also_buy]-(target:product)
  - id: 1
    name: "Find products from a given brand"
    hops: 1
    sampling_cypher: |
      MATCH path = (b:brand)-[:has_brand]-(target:product)
      WITH b, 
          count(DISTINCT target) AS answer_count,
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN b.name AS bname, answer_count, answer_ids, paths
      ORDER BY rand()
      LIMIT 5
    llm_input: ('{bname}':brand)-[:has_brand]-(target:product)
  - id: 2
    name: "Find colored products that are often bought with a given product"
    hops: 2
    sampling_cypher: |
      MATCH path = (p:product)-[:also_buy]-(target:product)-[:has_color]-(c:color)
      WITH p, c,
          count(DISTINCT target) AS answer_count,
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN p.name AS pname, c.name AS cname, answer_count, answer_ids, paths
      ORDER BY rand()
      LIMIT 5
    llm_input: ('{pname}':product)-[:also_buy]-(target:product)-[:has_color]-('{cname}':color)
  - id: 3
    name: "Find product given brand and category"
    hops: 2
    sampling_cypher: |
      MATCH path = (b:brand)-[:has_brand]-(target:product)-[:has_category]-(c:category)
      WITH b, c,
          count(DISTINCT target) AS answer_count,
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN b.name AS bname, c.name AS cname, answer_count, answer_ids, paths
      ORDER BY rand() 
      LIMIT 5
    llm_input: ('{bname}':brand)-[:has_brand]-(target:product)-[:has_category]-('{cname}':category)
  - id: 4
    name: "Find colored products often bought with products of a given category"
    hops: 3
    sampling_cypher: |
      MATCH path = (ca:category)-[:has_category]-(:product)-[:also_buy]-(target:product)-[:has_color]-(co:color)
      WITH ca, co, 
          count(DISTINCT target) AS answer_count, 
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN ca.name AS caname, co.name AS coname, answer_count, answer_ids, paths
      ORDER BY rand()
      LIMIT 5
    llm_input: ('{caname}':category)-[:has_category]-(:product)-[:also_buy]-(target:product)-[:has_color]-('{coname}':color)
  - id: 5
    name: "Find products often viewed with products of a given brand and color"
    hops: 3
    sampling_cypher: |
      MATCH path = (c:category)-[:has_category]-(p:product)-[:has_brand]-(b:brand),
          (p:product)-[:also_buy]-(target:product)
      WITH b, c,
          count(DISTINCT target) AS answer_count,
          collect(DISTINCT target.id) AS answer_ids,
          collect(path) AS paths
      WHERE answer_count >= 1 AND answer_count <= 10
      RETURN b.name AS bname, c.name AS cname, answer_count, answer_ids, paths
      ORDER BY rand()
      LIMIT 5
    llm_input: |
      ('{cname}':category)-[:has_category]-(p:product)-[:has_brand]-('{bname}':brand),
      (p:product)-[:also_buy]-(target:product)